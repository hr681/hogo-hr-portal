<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Portal – ระบบบุคคล (ต้นแบบคีย์ข้อมูลผ่านเว็บ)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{--pri:#243b5a;--pri2:#3a5a85;--gold:#d6a516;--line:#e6eaf1}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Thai","Noto Sans SC",sans-serif;color:#1f2937;background:linear-gradient(180deg,#eaf0f7 0%,#f5f8fc 55%,#eef3f9 100%);min-height:100vh}
body:before{content:"";position:fixed;right:0;bottom:0;width:min(780px,62vw);height:240px;background:var(--ship) no-repeat right bottom/contain;opacity:.07;pointer-events:none;z-index:0}
.t{font-size:14px;font-weight:600;line-height:1.4}.z{font-size:11.5px;color:#5b6472;line-height:1.35}
.app{display:flex;min-height:100vh;position:relative;z-index:1}.side{width:268px;flex:none;background:rgba(255,255,255,.92);box-shadow:2px 0 22px rgba(30,45,70,.07);padding:22px 0;position:sticky;top:0;height:100vh;overflow:auto}.main{flex:1;min-width:0;padding:0 36px 40px}
.brand{padding:0 22px 16px;margin-bottom:8px}.brand img,.lcard img{height:42px;margin-right:12px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:2px 12px;border-radius:12px;cursor:pointer;transition:background .15s}.nav a.gap{margin-top:12px}.nav a:hover{background:var(--t,#f3f4f6)}.nav a.on{background:var(--t,#f3f4f6);box-shadow:inset 0 0 0 1px rgba(36,59,90,.08)}
.nav a .d{width:9px;height:9px;border-radius:50%;background:var(--c,#ccc);flex:none}.nav a.on .t{color:var(--pri)}.bd{margin-left:auto;background:var(--gold);color:#fff;border-radius:10px;font-size:11px;padding:1px 8px;font-weight:600}
.sep{margin:14px 22px 0;border-top:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 -36px 22px;padding:12px 36px;background:rgba(255,255,255,.78);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.chip{display:flex;align-items:center;gap:14px}
.btn{font:inherit;background:var(--pri);color:#fff;border:1px solid var(--pri);border-radius:10px;padding:8px 16px;min-height:42px;cursor:pointer;text-align:left;text-decoration:none;display:inline-block;transition:filter .15s}.btn:hover{filter:brightness(1.12)}.btn .t,.btn .z{color:#fff}
.btn.o{background:#fff;border-color:#d5dce8}.btn.o .t{color:#1f2937}.btn.o .z{color:#5b6472}.btn.sm{padding:5px 12px;min-height:38px;white-space:nowrap}.btn.r{background:#fff;border-color:#ecc9c9}.btn.r .t,.btn.r .z{color:#9a3b3b}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(30,45,70,.05);padding:20px 24px;margin-top:18px}.h{padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.in{font:inherit;width:100%;min-height:42px;padding:8px 12px;border:1px solid #d5dce8;border-radius:10px;background:#fff}.in:focus{outline:0;border-color:var(--pri2);box-shadow:0 0 0 3px rgba(58,90,133,.15)}
.fld{display:block}.fld .in{margin-top:6px}.lb{font-size:12.5px;font-weight:600;color:#5b6472}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px 32px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 20px}.full{grid-column:1/-1}.v{font-size:15px;margin-top:3px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #f0f2f6;font-size:13px;vertical-align:middle}th{color:#5b6472;font-size:12px;background:#f8fafc}
.adm{display:inline-block;font-size:11px;padding:2px 9px;border-radius:10px;background:#fbf3dc;color:#8a6414;font-weight:600}
.row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f0f2f6}
.doc{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(30,45,70,.05);padding:16px 18px;border-top:5px solid var(--c);flex:1;min-width:280px;max-width:440px}
.spread{display:flex;justify-content:center;box-shadow:0 10px 32px rgba(30,45,70,.16);background:#fff;border-radius:6px;overflow:hidden;position:relative;min-height:300px}.spread canvas{display:block}
.mask{position:fixed;inset:0;background:rgba(20,32,50,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:18px;padding:24px;width:440px;max-width:100%;max-height:92vh;overflow:auto}.modal.w{width:860px}
.err{color:#9a3b3b;font-size:13px;margin-top:10px}.ok{color:#3f6b49}.warn{color:#8a6414}.bad{color:#9a3b3b}
.lg{min-height:100vh;display:flex;position:relative;z-index:1}.lgl{flex:1.1;background:linear-gradient(160deg,#1c3050,#2f5282);padding:44px;display:flex;flex-direction:column;justify-content:space-between}.lgr{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}.lcard{width:400px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 40px rgba(30,45,70,.12);padding:28px}
.demo{margin-top:16px;padding:10px 12px;background:#f3f6fb;border-radius:10px;font-size:12px;line-height:1.6}
.box{margin-top:14px;padding:14px;border:1px dashed #d9c58a;border-radius:12px;background:#fffaf0}
.wb{background:#fbf3dc;border:1px solid #efdfa8;color:#6b4a1f;padding:10px 14px;border-radius:12px;font-size:12px;margin-bottom:14px;line-height:1.6}
.ph{border:1px solid #d5dce8;border-radius:12px;background:#f5f8fc;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:90px}
@media(max-width:860px){.app{flex-direction:column}.side{width:auto;height:auto;position:static}.main{padding:0 14px 30px}.top{margin:0 -14px 16px;padding:10px 14px}.g2,.g3{grid-template-columns:1fr}.lgl{display:none}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cw{font-size:12px;font-weight:600;text-align:center;padding:6px;color:#5b6472}.cw.we{color:#b45f5f}.cd{min-height:100px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px 7px;cursor:pointer;overflow:hidden}.cd:hover{border-color:var(--pri2)}.cd.we{background:#e9edf4}.cd.off{border:0;background:transparent;cursor:default}.cd.td{box-shadow:inset 0 0 0 2px var(--gold)}.dn{font-size:12px;font-weight:600;margin-bottom:3px}.ch{font-size:11px;border-radius:6px;padding:2px 6px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}.ch.room{background:var(--pri2)}.ch.loan{background:#b98a1a}
.org{display:flex;flex-direction:column;align-items:center;overflow-x:auto;padding:6px 0 10px}.vl{width:2px;height:26px;background:#9fb0c6}.deps{display:flex;justify-content:center}.dep{position:relative;padding:26px 10px 0}.dep:before{content:"";position:absolute;top:0;left:50%;width:2px;height:26px;background:#9fb0c6}.dep:after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:#9fb0c6}.dep:first-child:after{left:50%}.dep:last-child:after{right:50%}.dep:only-child:after{display:none}
.ob{width:212px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(30,45,70,.07);overflow:hidden}.oh{background:linear-gradient(135deg,#243b5a,#3a5a85);padding:10px 14px}.oh .t,.oh .z{color:#fff}.oh .z{opacity:.8}.oe{padding:12px 10px;border-top:1px solid #f0f2f6}.nn{font-size:21px;font-weight:700;color:#243b5a;text-align:center;letter-spacing:.5px;line-height:1.2;margin-top:3px}.oadd{padding:8px;border-top:1px dashed #d9c58a;background:#fffaf0;display:flex;gap:6px;flex-direction:column}
</style>

function obox(slot,t,z){const l=orgList(slot);return `<div class="ob"><div class="oh">${bi(t,z)}</div>${l.map((e,i)=>ecard(e,i,l.length)).join('')||'<div class="z" style="text-align:center;padding:12px">ยังไม่มี · 暂无</div>'}${adm()?`<div class="oadd"><select class="in" id="os_${slot}"><option value="">+ เลือกพนักงาน 选择员工</option>${DB.emps.filter(e=>e.org!==slot).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select>${btn('เพิ่ม','添加',`orgAdd('${slot}')`,'sm')}</div>`:''}</div>`}
const SL=['md','gm','d0','d1','d2','d3'];
const orgList=slot=>DB.emps.filter(e=>e.org===slot).sort((a,b)=>(a.orgPos||0)-(b.orgPos||0)||a.id-b.id);
const ordEmps=()=>DB.emps.slice().sort((a,b)=>{const x=SL.indexOf(a.org),y=SL.indexOf(b.org);return (x<0?99:x)-(y<0?99:y)||(a.orgPos||0)-(b.orgPos||0)||a.id-b.id});
function orgNorm(slot){orgList(slot).forEach((x,i)=>x.orgPos=i+1)}
function orgMove(id,d){const e=EMP(id);orgNorm(e.org);const l=orgList(e.org),i=l.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=l.length)return;const tmp=l[i].orgPos;l[i].orgPos=l[j].orgPos;l[j].orgPos=tmp;save();R()}
function orgTop(id){const e=EMP(id);orgNorm(e.org);e.orgPos=0;orgNorm(e.org);save();R()}
const orgTree=()=>`<div class="org">${obox('md','กรรมการผู้จัดการ','总经理')}<div class="vl"></div>${obox('gm','ผู้จัดการทั่วไป','综合经理 (GM)')}<div class="vl"></div><div class="deps">${DEP.map((d,i)=>`<div class="dep">${obox('d'+i,d[0],d[1])}</div>`).join('')}</div></div>`;
function orgSet(id,slot){const e=EMP(id);e.org=slot;if(slot){e.orgPos=0;e.orgPos=Math.max(0,...orgList(slot).filter(x=>x.id!==id).map(x=>x.orgPos||0))+1}else e.orgPos=0;save();R()}
function orgAdd(slot){const s=$('#os_'+slot),v=s&&s.value;if(!v)return alert('เลือกพนักงาน · 请选择员工');orgSet(+v,slot)}
const supTabs=()=>`<div style="display:flex;gap:8px;margin:14px 0 0">${btn('เบิกอุปกรณ์','领用办公用品',"S.st='req';R()",S.st==='cal'?'o sm':'sm')}${btn('จองห้องประชุม / ปฏิทิน','会议室预约／日历',"S.st='cal';R()",S.st==='cal'?'sm':'o sm')}</div>`;
const WD=[['อา','日'],['จ','一'],['อ','二'],['พ','三'],['พฤ','四'],['ศ','五'],['ส','六']];
function calNav(d){let m=S.cm+d,y=S.cy;if(m<0){m=11;y--}if(m>11){m=0;y++}S.cm=m;S.cy=y;R()}
function supCal(){const now=new Date();if(S.cy==null||S.cy===undefined){S.cy=now.getFullYear();S.cm=now.getMonth()}const y=S.cy,m=S.cm,dim=new Date(y,m+1,0).getDate(),off=new Date(y,m,1).getDay(),td=`${now.getFullYear()}-${p2(now.getMonth()+1)}-${p2(now.getDate())}`;let cells='';for(let i=0;i<off;i++)cells+='<div class="cd off"></div>';for(let d=1;d<=dim;d++){const iso=`${y}-${p2(m+1)}-${p2(d)}`,w=new Date(y,m,d).getDay(),es=DB.cal.filter(x=>x.date===iso).sort((a,b)=>(a.start||'')<(b.start||'')?-1:1);cells+=`<div class="cd${w===0||w===6?' we':''}${iso===td?' td':''}" onclick="openDay('${iso}')"><div class="dn">${d}</div>${es.slice(0,3).map(x=>`<div class="ch ${x.type}">${esc(x.start?x.start+' ':'')}${esc(x.title||x.room||'')}</div>`).join('')}${es.length>3?`<div class="z">+${es.length-3}</div>`:''}</div>`}
return ttl('เบิกอุปกรณ์สำนักงาน','领用办公用品')+supTabs()+card('ปฏิทินจองห้องประชุมและยืมอุปกรณ์ (ทุกคนเห็น)','会议室预约与设备借用日历（所有人可见）',`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">${btn('‹','上月','calNav(-1)','o sm')}<select class="in" style="width:170px" onchange="S.cm=+this.value;R()">${TM.map((n,i)=>`<option value="${i}"${i===m?' selected':''}>${n}</option>`).join('')}</select><input class="in" type="number" style="width:110px" value="${y}" onchange="S.cy=+this.value||S.cy;R()"><span class="t">${TM[m]} ${y+543} · ${y}年${m+1}月</span>${btn('›','下月','calNav(1)','o sm')}${btn('วันนี้','今天',"S.cy=null;R()",'o sm')}<span style="flex:1"></span><span class="z"><span class="ch room" style="display:inline-block">ห้องประชุม 会议室</span> <span class="ch loan" style="display:inline-block">ยืมอุปกรณ์ 借用设备</span> พื้นหลังเทา = เสาร์-อาทิตย์ 灰底=周末</span></div><div class="cal">${WD.map((w,i)=>`<div class="cw${i===0||i===6?' we':''}">${w[0]} ${w[1]}</div>`).join('')}${cells}</div><div class="z" style="margin-top:10px">คลิกวันที่เพื่อดู/จอง/ยืม · 点击日期查看、预约或借用</div>`)}
function openDay(iso,id){const es=DB.cal.filter(x=>x.date===iso).sort((a,b)=>(a.start||'')<(b.start||'')?-1:1),x=DB.cal.find(q=>q.id===id)||{},my=adm()?(x.emp||(DB.emps[0]||{}).id):S.user;S.ce=id||null;S.cd=iso;
S.modal=`<div class="h">${bi(fmt(D(iso)),'วันที่ 日期','style="font-size:16px"')}</div>${es.map(q=>`<div class="kv" style="align-items:flex-start"><div><span class="ch ${q.type}" style="display:inline-block">${q.type==='room'?'ห้องประชุม 会议室':'ยืมอุปกรณ์ 借设备'}</span><div class="t" style="margin-top:4px">${esc(q.title)}${q.room?' · '+esc(q.room):''}</div><div class="z">${q.start?esc(q.start)+'–'+esc(q.end||'')+' · ':''}${esc(q.who)}</div>${q.details?`<div class="z">${esc(q.details)}</div>`:''}</div><div style="white-space:nowrap">${adm()?btn('แก้ไข','编辑',`openDay('${iso}',${q.id})`,'o sm')+' ':''}${(adm()||q.emp===S.user)?btn('ลบ','删除',`delCal(${q.id})`,'r sm'):''}</div></div>`).join('')||'<div class="z">ยังไม่มีรายการ · 暂无记录</div>'}<div class="box"><div class="t">${id?'แก้ไขรายการ 编辑':'เพิ่มรายการ 添加'}</div><div class="g2" style="margin-top:10px">${fld('ประเภท','类别',`<select class="in" id="ct"><option value="room"${x.type!=='loan'?' selected':''}>จองห้องประชุม 预约会议室</option><option value="loan"${x.type==='loan'?' selected':''}>ยืมอุปกรณ์ 借用设备</option></select>`)}${fld('ห้อง / อุปกรณ์','会议室／设备',`<input class="in" id="cr" value="${esc(x.room||'')}" placeholder="เช่น ห้องประชุม 1">`)}${fld('เวลาเริ่ม','开始时间',`<input class="in" id="cs" type="time" value="${esc(x.start||'')}">`)}${fld('เวลาสิ้นสุด','结束时间',`<input class="in" id="ce" type="time" value="${esc(x.end||'')}">`)}${fld('หัวข้อ','主题',`<input class="in" id="ch" value="${esc(x.title||'')}">`)}${fld('ผู้จอง/ผู้ยืม','预约人／借用人',`<select class="in" id="cw" ${adm()?'':'disabled'}>${DB.emps.map(e=>`<option value="${e.id}"${e.id===my?' selected':''}>${esc(e.name)}</option>`).join('')}</select>`)}<div class="full">${fld('รายละเอียด','详情',`<textarea class="in" id="cx" rows="3">${esc(x.details||'')}</textarea>`)}</div></div><div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">${btn('ปิด','关闭',"S.modal='';R()",'o sm')}${btn('บันทึก','保存','addCal()','sm')}</div></div>`;S.mw=0;R()}
function addCal(){const t=$('#ct').value,date=S.cd,s=$('#cs').value,en=$('#ce').value,room=$('#cr').value.trim(),title=$('#ch').value.trim(),emp=EMP(+$('#cw').value)||EMP(S.user);if(!title&&!room)return alert('กรอกหัวข้อหรือห้อง · 请填写主题或会议室');if(t==='room'){if(!room)return alert('ระบุห้องประชุม · 请填写会议室');if(!s||!en||en<=s)return alert('ระบุเวลาเริ่มและสิ้นสุด · 请填写开始与结束时间');const c=DB.cal.find(q=>q.type==='room'&&q.id!==S.ce&&q.date===date&&q.room.toLowerCase()===room.toLowerCase()&&q.start<en&&s<q.end);if(c)return alert('ห้องนี้ถูกจองแล้ว '+c.start+'–'+c.end+' โดย '+c.who+' · 该时段已被预约')}const o={type:t,date,start:s,end:en,room,title,emp:emp?emp.id:S.user,who:emp?emp.name:'',details:$('#cx').value};if(S.ce)Object.assign(DB.cal.find(q=>q.id===S.ce),o);else DB.cal.push({id:DB.kid++,...o});save();openDay(date)}
function delCal(id){const q=DB.cal.find(x=>x.id===id);if(!q||!confirm('ลบรายการ? · 删除记录？'))return;DB.cal=DB.cal.filter(x=>x.id!==id);save();openDay(q.date)}

init();
</script></body></html>
